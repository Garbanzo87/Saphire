server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export uses trailingSlash so /evals/detail -> /evals/detail/index.html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
