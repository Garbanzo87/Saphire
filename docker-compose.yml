# Full stack: Postgres + API + worker + dashboard.
#   docker compose up --build
#   docker compose exec api saphire demo --host http://api:8000        # populate with the end-to-end demo
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saphire
      POSTGRES_PASSWORD: saphire
      POSTGRES_DB: saphire
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saphire"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., args: { EXTRAS: "providers,mcp,postgres" } }
    environment: &env
      SAPHIRE_DATABASE_URL: postgresql+psycopg://saphire:saphire@db:5432/saphire
      SAPHIRE_API_KEY: ${SAPHIRE_API_KEY:-dev-key}
      SAPHIRE_ARTIFACTS_DIR: /artifacts
      SAPHIRE_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SAPHIRE_JWT_SECRET: ${SAPHIRE_JWT_SECRET:-change-me}
      SAPHIRE_DEV_LOGIN: ${SAPHIRE_DEV_LOGIN:-1}
      SAPHIRE_OIDC_ISSUER: ${SAPHIRE_OIDC_ISSUER:-}
      SAPHIRE_OIDC_CLIENT_ID: ${SAPHIRE_OIDC_CLIENT_ID:-}
      SAPHIRE_OIDC_CLIENT_SECRET: ${SAPHIRE_OIDC_CLIENT_SECRET:-}
      SAPHIRE_ARTIFACT_STORE: ${SAPHIRE_ARTIFACT_STORE:-}
      SAPHIRE_RETENTION_DAYS: ${SAPHIRE_RETENTION_DAYS:-0}
    ports: ["8000:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., args: { EXTRAS: "providers,mcp,postgres" } }
    command: ["saphire", "worker"]
    environment: *env
    volumes: ["artifacts:/artifacts"]
    depends_on: { db: { condition: service_healthy } }
    deploy: { replicas: 1 }

  env-server:          # optional: reward/environment server for external RL trainers (verl / OpenRLHF)
    build: { context: ., args: { EXTRAS: "providers,mcp,postgres" } }
    command: ["saphire", "env-server", "--port", "8010"]
    environment: *env
    ports: ["8010:8010"]
    profiles: ["rl"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SAPHIRE_API: ${NEXT_PUBLIC_SAPHIRE_API:-http://localhost:8000}
        NEXT_PUBLIC_SAPHIRE_API_KEY: ${SAPHIRE_API_KEY:-dev-key}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  artifacts:
