name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev,mcp,distributed,auth]"
      - run: ruff check saphire tests
      - run: pytest -q -m "not slow"
      - name: end-to-end demo (API + inline jobs)
        run: |
          SAPHIRE_INLINE_JOBS=1 saphire serve --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          saphire demo --iterations 2
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: saphire, POSTGRES_PASSWORD: saphire, POSTGRES_DB: saphire }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saphire" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev,mcp,postgres,auth]"
      - name: migrations apply cleanly on Postgres
        run: SAPHIRE_DATABASE_URL=postgresql+psycopg://saphire:saphire@localhost:5432/saphire alembic upgrade head
      - name: API + job tests against Postgres
        run: SAPHIRE_TEST_DATABASE_URL=postgresql+psycopg://saphire:saphire@localhost:5432/saphire pytest -q tests/test_server.py tests/test_enterprise.py tests/test_scale.py tests/test_intelligence.py
      - name: benchmark on Postgres (quick)
        run: |
          SAPHIRE_DATABASE_URL=postgresql+psycopg://saphire:saphire@localhost:5432/saphire SAPHIRE_INLINE_JOBS=1 saphire serve --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          saphire bench --host http://localhost:8000 --quick
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -q -m slow tests/test_training.py
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t saphire:ci .
      - run: docker build -t saphire-dashboard:ci ./frontend
