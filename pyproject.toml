[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saphire"
version = "0.1.0"
description = "Saphire: turn first-party data, tools and environments into a continuously learning agent stack (tracing, signal generation, offline/online RL, pre-deployment evaluation)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Saphire contributors" }]
keywords = ["agents", "reinforcement-learning", "evaluation", "observability", "llm", "mcp"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real LLM providers (OpenAI, Anthropic, Azure, Bedrock, Ollama, ... via LiteLLM)
providers = ["litellm>=1.40"]
# Model Context Protocol tool servers as environments / tool sources
mcp = ["mcp>=1.0"]
# Weight-update training (SFT / DPO / GRPO) with HF TRL + PEFT LoRA
train = ["torch>=2.2", "transformers>=4.40", "trl>=0.9", "peft>=0.10", "datasets>=2.19", "accelerate>=0.30"]
# Postgres in production
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
all = ["saphire[providers,mcp,train,postgres,dev]"]

[project.scripts]
saphire = "saphire.cli:app"

[tool.setuptools.packages.find]
include = ["saphire*"]

[tool.setuptools.package-data]
saphire = ["environments/data/*.json", "environments/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: needs torch/TRL (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
