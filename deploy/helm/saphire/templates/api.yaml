apiVersion: apps/v1
kind: Deployment
metadata: { name: saphire-api, labels: { app: saphire-api } }
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: saphire-api } }
  template:
    metadata: { labels: { app: saphire-api } }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "saphire.envFrom" . | nindent 10 }}
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 30 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          {{- include "saphire.volumes" . | nindent 10 }}
      {{- include "saphire.podVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata: { name: saphire-api }
spec:
  selector: { app: saphire-api }
  ports: [{ port: 8000, targetPort: 8000 }]
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: saphire-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: saphire-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPU }} } }
{{- end }}
