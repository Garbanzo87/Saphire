{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata: { name: {{ .Values.secrets.name }} }
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if .Values.artifacts.pvc.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: saphire-artifacts }
spec:
  accessModes: [ReadWriteMany]
  {{- if .Values.artifacts.pvc.storageClass }}
  storageClassName: {{ .Values.artifacts.pvc.storageClass }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.artifacts.pvc.size }} } }
{{- end }}
